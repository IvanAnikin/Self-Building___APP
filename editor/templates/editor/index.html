<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Building App - Code Editor</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Self-Building App</h1>
            <p class="subtitle">AI-Powered Code Editor - Request features, watch them come to life</p>
        </header>
        
        <div class="main-content">
            <!-- Editor Section (2/3 width) -->
            <div class="editor-section">
                <div class="editor-header">
                    <div class="editor-title">
                        <span class="icon">📝</span>
                        <input type="text" id="filename" placeholder="filename.py" value="main.py">
                    </div>
                    <div class="editor-controls">
                        <button id="saveBtn" class="btn btn-primary">💾 Save</button>
                        <button id="runBtn" class="btn btn-success">▶️ Run</button>
                    </div>
                </div>
                <textarea id="editor" class="editor" spellcheck="false"># Welcome to Self-Building App!
# This is a Python code editor with AI-powered feature development.

def hello_world():
    """A simple hello world function"""
    print("Hello, World!")
    return "Welcome to the Self-Building App!"

if __name__ == "__main__":
    result = hello_world()
    print(result)
</textarea>
            </div>
            
            <!-- Chatbot Section (1/3 width) -->
            <div class="chatbot-section">
                <div class="chatbot-header">
                    <span class="icon">🤖</span>
                    <h2>AI Assistant</h2>
                </div>
                <div id="chatMessages" class="chat-messages">
                    <div class="message bot-message">
                        <div class="message-content">
                            <strong>AI Assistant:</strong>
                            <p>Hello! I'm your AI assistant. Tell me what features you'd like to add to this application, and I'll help develop them for you.</p>
                        </div>
                    </div>
                </div>
                <div class="chat-input-container">
                    <textarea id="chatInput" placeholder="Describe the feature you want to add..." rows="3"></textarea>
                    <button id="sendBtn" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
